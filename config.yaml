# Job Hunter configuration.
# Edit these to match what you're looking for. All fields have sensible defaults.

# Search terms sent to each source (one query per term). Chosen 2026-10-21 from
# the master CV + live Platsbanken counts. NLP engineer was dropped: no openings
# in Sweden. "AI-specialist" is how Swedish ads (Nordea, PTS) title AI roles.
queries:
  - "data scientist"
  - "machine learning engineer"
  - "AI engineer"
  - "data engineer"
  - "analytics engineer"
  - "AI-specialist"
  - "data analyst"

# Preferred locations. Used as a location-match boost.
# "Remote" is treated specially (matches remote-flagged / remote-mentioning jobs).
# Gothenburg is listed twice: Platsbanken writes "Göteborg", LinkedIn often
# "Gothenburg". Suburbs like Mölndal don't contain either name and stay out.
locations:
  - "Stockholm"
  - "Uppsala"
  - "Göteborg"
  - "Gothenburg"
  - "Remote"

# How the final 0-100 score blends the three signals. Weights are renormalized
# automatically if a signal is unavailable (e.g. no CV yet, or no trained model).
blend:
  keyword: 0.2     # hand-tuned keyword rules below
  semantic: 0.4    # TF-IDF cosine similarity of the job to your cv.md
  relevance: 0.4   # trained relevance classifier probability (after you label some jobs)

ranking:
  # Terms that raise the keyword score (weight added; title matches count double).
  positive:
    # Seniority: bias toward entry-level / junior roles.
    junior: 25
    "entry level": 25
    graduate: 12
    # Skills / tools you value.
    python: 15
    "machine learning": 12
    "deep learning": 10
    AI: 10
    pytorch: 8
    mlops: 8
    nlp: 8
    # Evaluation work lives inside AI/ML ads, not in job titles (2026-10-21).
    evaluation: 8
    LLM: 8
    remote: 6
  # Terms that lower the keyword score (weight subtracted), matched in title,
  # description, OR company name. (senior/lead moved to excluded_titles.
  # Consultancies are fine since 2026-10-14: not penalized here, only tagged
  # "consultant" in the viewer for information.)
  negative:
    php: 20
    ".net": 15
  # If non-empty, a job must contain at least one of these to survive.
  required: []
  # A job is dropped if any of these appear in the title, description, OR company
  # name. (Internships are no longer listed here: unpaid ones are dropped by
  # rank.py's _is_unpaid_internship, paid ones are kept.)
  excluded: []
  # Drop ads that REQUIRE Swedish. Ads merely written in Swedish are kept — if
  # they never demand the language you can still apply, and those ads get far
  # fewer international applicants. "Svenska är meriterande" is a plus, not a
  # requirement, so those stay too.
  drop_if_swedish_required: true
  # Only show jobs you could actually take: remote, or in `locations` above.
  # ("Stockholms län" contains "Stockholm", so Solna/Södertälje pass too.)
  location_filter: true
  # Years of experience you can claim. Ads asking for more are REMOVED (his rule,
  # 2026-10-21: 3 is the max, 4+ is a big no). Ads that state no years are kept.
  # When an ad names several figures the smallest counts, so "3-5 years" is 3.
  # Set drop_over_experience: false to only push them down instead
  # (experience_penalty points per extra year). 0 disables this entirely.
  max_years_experience: 3
  experience_penalty: 8      # only used when drop_over_experience is false
  drop_over_experience: true
  # A job is dropped if any of these appear in its TITLE (level filtering),
  # whether or not the ad states any years. Whole words only, so Swedish
  # compounds like "Utvecklingschef" are not caught by "chef".
  excluded_titles:
    - senior
    - lead
    - principal
    - staff
    - "head of"
    - manager
    - chef           # Swedish for "manager"
    - architect
    - director
  # ...unless the title also says one of these (e.g. "Product Manager, Early
  # Career Program" stays).
  excluded_title_exceptions:
    - junior
    - graduate
    - trainee
    - "early career"
    - "entry level"
  # Linear recency boost applied within this many days of posting.
  recency_days: 30
  # Hard cutoff: drop any posting older than this many days (0 = keep all ages).
  max_age_days: 30
  # Boost applied to remote roles.
  remote_boost: 10

# Per-source limits.
sources:
  platsbanken:
    limit: 100       # results per query (max 100 per JobTech request)
  jobspy:
    # google/glassdoor excluded: google's jobspy scraper is currently broken
    # upstream, glassdoor has no Sweden support in jobspy. See jobspy_source.py.
    sites: [linkedin, indeed]
    results_wanted: 20   # per (site, query) call — kept modest, see jobspy_source.py
    hours_old: 72         # only scrape postings from the last 3 days
    country_indeed: "Sweden"
    location: "Sweden"
